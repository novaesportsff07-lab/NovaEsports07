<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><title>NOVA ESPORTS | Player Login</title>
<style>
:root{--gold:#f2b81f;--gold2:#ffe08a;--bg:#050505;--card:#101014;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#3b2108,transparent 38%),radial-gradient(circle at 90% 20%,#211044,transparent 35%),var(--bg);color:#fff;font:16px system-ui;display:grid;place-items:center;padding:18px}
main{width:min(100%,460px)}.brand{text-align:center;font-weight:1000;font-style:italic;font-size:34px;letter-spacing:2px;color:var(--gold2)}.brand small{display:block;font:700 11px system-ui;letter-spacing:7px;color:var(--gold)}
.card{margin-top:20px;background:var(--card);border:1px solid #735817;border-radius:18px;padding:22px;box-shadow:0 10px 40px #0009}
h1{font-size:22px;margin:0 0 6px;color:var(--gold2)}p{color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.tabs button,.btn{border:1px solid var(--gold);border-radius:10px;padding:13px;background:#17130a;color:var(--gold2);font-weight:800;cursor:pointer}
.tabs button.active,.btn.primary{background:var(--gold);color:#090909}
label{display:block;margin:12px 0 6px;font-size:13px;color:#ddd}input{width:100%;padding:13px;border:1px solid #51421e;border-radius:10px;background:#080808;color:#fff;font:inherit}
.btn{width:100%;margin-top:12px}.google{background:#f5f5f5;color:#111;border:0}.divider{text-align:center;color:#888;margin:14px}.status{min-height:22px;color:#ffb4a8;font-size:13px;margin-top:12px;overflow-wrap:anywhere}
[hidden]{display:none!important}#recaptcha-container{margin-top:12px;min-height:10px}
</style>
</head>
<body><main>
<div class="brand">NOVA<small>ESPORTS</small></div>
<section class="card">
<h1>Player Login / Create Account</h1><p>Sign in with Google or verify your mobile number.</p>
<button class="btn google" id="googleBtn">Continue with Google</button>
<div class="divider">OR</div>
<div class="tabs"><button id="phoneTab" class="active" type="button">Mobile OTP</button><button id="verifyTab" type="button">Verify OTP</button></div>
<div id="phonePane">
<label for="phone">Mobile number with country code</label>
<input id="phone" type="tel" placeholder="+919876543210" autocomplete="tel">
<button class="btn primary" id="sendOtp">Send OTP</button>
<div id="recaptcha-container"></div>
</div>
<div id="otpPane" hidden>
<label for="otp">6-digit OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter OTP">
<button class="btn primary" id="verifyOtp">Verify and Login</button>
</div>
<div class="status" id="status" role="status"></div>
</section></main>
<script type="module" src="./nova-auth.js"></script>
</body></html>
